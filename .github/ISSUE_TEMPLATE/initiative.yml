name: Initiative
description: A portfolio-level outcome spanning a quarter or more; parent of Epics.
title: "[Initiative]: "
type: Initiative
body:
  - type: markdown
    attributes:
      value: |
        Initiatives describe outcomes, not tasks. Break them down into Epics and attach those as **sub-issues**.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The change in the world we want to achieve.
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why now?
      description: Evidence, opportunity or risk that makes this a priority.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: quarter
    attributes:
      label: Target quarter
      options:
        - 2026 Q4
        - 2027 Q1
        - 2027 Q2
        - 2027 Q3
        - 2027 Q4
        - Later
    validations:
      required: true
  - type: textarea
    id: epics
    attributes:
      label: Candidate epics
      description: Epics expected to deliver this outcome (link as sub-issues once created).
