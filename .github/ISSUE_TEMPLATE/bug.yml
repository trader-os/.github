name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Web
        - Worker / API
        - MCP
        - macOS
        - iOS
        - iPadOS
        - watchOS
        - tvOS
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / environment
      placeholder: e.g. v1.4.2, commit abc1234, production
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, screenshots or output
      description: Paste logs here; they will be rendered as code. Redact secrets and personal data.
      render: shell
